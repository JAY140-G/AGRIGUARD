    build:
      dockerfile: Dockerfile.prepared
  migrate:
    build:
      dockerfile: Dockerfile.prepared
  worker:
    build:
      dockerfile: Dockerfile.prepared
  web:
    build:
      dockerfile: Dockerfile.prepared
